name: Branch policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR base (git-flow)
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "head=$HEAD base=$BASE"
          case "$BASE" in
            [0-9]*-*|migrat*) echo "::warning::PR stacked on legacy branch '$BASE'; allowed until git-flow adoption (docs/standards/gitflow.md)"; exit 0 ;;
          esac
          case "$HEAD" in
            feature/*|bugfix/*) want=develop ;;
            release/*|hotfix/*) want=main ;;
            develop) want=main ;;       # back-merge or release promotion
            main)    want=develop ;;    # back-merge after a release or hotfix
            [0-9]*-*|migrat*) echo "::warning::Legacy branch name; use feature/, bugfix/, release/ or hotfix/ (docs/standards/gitflow.md)"; exit 0 ;;
            *) echo "::error::Branch '$HEAD' must start with feature/, bugfix/, release/ or hotfix/ (docs/standards/gitflow.md)"; exit 1 ;;
          esac
          if [ "$BASE" != "$want" ]; then
            echo "::error::Branch '$HEAD' must target '$want', not '$BASE' (docs/standards/gitflow.md)"
            exit 1
          fi
